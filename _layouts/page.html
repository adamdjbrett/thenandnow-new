---
layout: default
---
<div class="post">

  <header class="post-header">
    <h1 class="post-title p-name">{{ page.title }}</h1>
    <link class="u-url" itemprop="url" href="{{ page | scholarly_url: site | escape }}">
  </header>

  <article class="post-content e-content">
    {{ content }}
  </article>

</div>
